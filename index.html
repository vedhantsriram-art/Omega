<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Bedrock: Omega SAP S/4HANA Cloud Public Edition kickoff</title>
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&amp;family=JetBrains+Mono:wght@400..700&amp;display=swap">
<script>(function(){var t="dark";try{if(localStorage.getItem("sk.theme")==="light")t="light"}catch(e){}document.documentElement.setAttribute("data-theme",t)})();</script>
<style>
:root{color-scheme:dark;--bg:#0A1110;--surface:#111B18;--surface2:#16231F;--line:#1F2F2A;--line2:#2E443D;--ink:#F3F6F4;--ink2:#C6D2CC;--muted:#93A69D;--accent:#DF2A36;--accent-t:#F06B74;--accent-2:#8FB3C7;--on-accent:#FFFFFF;--glow:rgba(233,44,57,.40);--omega:#E92C39;--solaris:#436577;--solaris-t:#9CBBCB;--teal:#3BB0C6;--teal-fill:#17788B;--teal-soft:rgba(240,107,116,.10);--teal-text:#F06B74;--signal:#FFB93B;--signal-soft:rgba(255,185,59,.12);--signal-text:#FFCB6B;--nav-on:rgba(255,107,111,.15);--ph1:#5B93C7;--ph2:#F08A3C;--ph3:#79BC5A;--ph4:#E5534F;--ph5:#F2B632;--ph1t:#8FB8E0;--ph2t:#F5A266;--ph3t:#95D07A;--ph4t:#F0827E;--ph5t:#F5C85E;--ph1o:#0F2029;--ph2o:#0F2029;--ph3o:#0F2029;--ph4o:#0F2029;--ph5o:#0F2029;--cream:rgba(242,182,50,.12);--road:#1A2A25;--road-edge:#2E443D;--focus:#F06B74;--ctl:#7C968B;--photo-op:.85;}
:root[data-theme="light"]{color-scheme:light;--bg:#F3F5F3;--surface:#FFFFFF;--surface2:#F0F3F1;--line:#D9E1DC;--line2:#B3C3BA;--ink:#14201B;--ink2:#394A42;--muted:#566A60;--accent:#C8202A;--accent-t:#B3151F;--accent-2:#5E8296;--on-accent:#FFFFFF;--glow:rgba(200,32,42,.25);--omega:#E92C39;--solaris:#385561;--solaris-t:#385561;--teal:#1D889D;--teal-fill:#17788B;--teal-soft:rgba(200,32,42,.07);--teal-text:#B3151F;--signal:#C77700;--signal-soft:rgba(199,119,0,.12);--signal-text:#8A5200;--nav-on:rgba(200,32,42,.10);--ph1:#1F4E79;--ph2:#E1701A;--ph3:#5FA340;--ph4:#C00000;--ph5:#EFA400;--ph1t:#1F4E79;--ph2t:#A4500B;--ph3t:#3B7425;--ph4t:#A80000;--ph5t:#7F5900;--ph1o:#FFFFFF;--ph2o:#14202A;--ph3o:#14202A;--ph4o:#FFFFFF;--ph5o:#14202A;--cream:#FFF6DE;--road:#CCD6D0;--road-edge:#A2B3AA;--focus:#C8202A;--ctl:#6E8277;--photo-op:.45;}

*,*::before,*::after{box-sizing:border-box}
:root{--font:"Outfit","Helvetica Neue",Arial,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{font-size:90%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:350 1rem/1.58 var(--font);font-synthesis:none;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3,h4{color:var(--ink);font-weight:700;letter-spacing:-.015em;line-height:1.12}
button{font:inherit;color:inherit}
a{color:var(--accent-t)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}
.ic{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icu{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}.small{font-size:.9rem}.tn{font-variant-numeric:tabular-nums}.nb{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:99px;border:1px solid var(--line2)}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
.eyebrow{font-family:var(--mono);font-size:.78rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-t);line-height:1.5}


/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:88px;display:flex;align-items:center;gap:20px;padding:0 clamp(16px,2.2vw,40px);background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:16px;text-decoration:none;flex:none}
.plate-o{display:grid;place-items:center;height:60px;padding:0 16px;border-radius:16px;background:var(--omega);color:#fff;font-weight:800;font-size:1.18rem;letter-spacing:.14em;line-height:1;flex:none}
.plate-o.logo{background:#121212;padding:0 14px}
.plate-o.logo img{display:block;height:46px;width:auto}
html[data-theme="light"] .plate-s{border:1px solid var(--line2)}
.nav-brand{display:none}
.plate-s{display:grid;place-items:center;height:60px;padding:0 13px;border-radius:16px;background:#fff}
.plate-s img{display:block;height:46px;width:auto}
.bdiv{width:1px;height:40px;background:var(--line2)}
.kt{display:block;height:31px;width:auto}
.kt-b{display:none}
html[data-theme="light"] .kt-w{display:none}
html[data-theme="light"] .kt-b{display:block}
.nav{margin-left:auto}
.nav ul{display:flex;gap:2px}
.nav a{position:relative;display:block;padding:10px 15px 15px;border-radius:999px;color:var(--ink2);text-decoration:none;font-size:.97rem;font-weight:400;white-space:nowrap;transition:color .15s}
.nav a .f{display:none}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--accent-t);font-weight:500;background:var(--nav-on)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.top-actions{display:flex;align-items:center;gap:16px;flex:none}
.iconbtn{width:46px;height:46px;display:inline-grid;place-items:center;border-radius:50%;border:1px solid var(--line2);background:var(--surface);color:var(--ink);cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
.menubtn{display:none}
.scrim{display:none}
main{display:block;min-height:60vh}
main:focus{outline:none}
.wrap{max-width:1400px;margin:0 auto;padding:0 clamp(18px,3.4vw,56px)}
.wrap.pg{padding-top:clamp(20px,2.4vw,34px)}
.view{padding-bottom:28px}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.pager a{display:flex;align-items:center;gap:14px;color:var(--ink);text-decoration:none;font-weight:600;max-width:48%;padding:12px 22px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.pager a small{display:block;color:var(--muted);font-weight:350;font-size:.78rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.pager a:hover{border-color:var(--accent)}
.pager .nx{margin-left:auto;text-align:right}

/* page head and shared pieces */
.vh{margin-bottom:20px}
.vh h1{font-size:clamp(1.15rem,2.4vw,2.3rem);max-width:none;white-space:nowrap}
.lead{font-size:1.05rem;font-weight:300;color:var(--ink2);max-width:66ch;line-height:1.7}
.tabs,.seg{display:inline-flex;max-width:100%;gap:4px;padding:6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow-x:auto;scrollbar-width:none}
.tabs{margin:4px 0 20px}
.tab,.seg button{appearance:none;border:0;background:none;padding:10px 20px;border-radius:999px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover,.seg button:hover{color:var(--ink)}
.tab[aria-selected="true"],.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 30px -10px var(--glow)}
.seg{margin-bottom:18px}
.panel[hidden]{display:none}
.sec{margin-top:40px}
.sec>.eyebrow{margin-bottom:6px}
.sec>h2{font-size:clamp(1.3rem,1.9vw,1.7rem);margin:8px 0 6px}
.sec>p.sub{color:var(--ink2);max-width:62ch;margin-bottom:16px;font-weight:300;font-size:1rem}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 26px;font-weight:600;border-radius:999px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;text-decoration:none;line-height:1.2;box-shadow:0 10px 34px -12px var(--glow)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent-t);box-shadow:none}
.btn.sm{padding:9px 18px;font-size:.92rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:99px;font-size:.88rem;font-weight:500;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink)}
.chip.s{background:var(--solaris);border-color:var(--solaris);color:#fff}
.chip.k{background:var(--teal-fill);border-color:var(--teal-fill);color:#fff}
.chip.tbc{border-style:dashed;color:var(--muted);background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.confirm{margin-top:28px;border:1px dashed var(--line2);border-radius:20px}
.confirm summary{cursor:pointer;padding:15px 22px;font-weight:600;display:flex;align-items:center;gap:12px;list-style:none}
.confirm summary::-webkit-details-marker{display:none}
.confirm summary .ic{color:var(--accent-t)}
.confirm summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.confirm[open] summary::after{transform:rotate(-135deg)}
.confirm ul{padding:0 22px 18px 50px;list-style:disc;color:var(--ink2)}
.confirm li{margin:5px 0}
.confirm li::marker{color:var(--accent)}
.crumb{color:inherit;text-decoration:none}
.crumb:hover{text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:18px;font-size:.88rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:9px}
.sw{width:14px;height:14px;border-radius:5px;display:inline-block;border:1.5px solid var(--line2);background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px}

/* home: hero */
.hero2{position:relative;overflow:hidden;isolation:isolate;border-bottom:1px solid var(--line)}
.hero-photo{position:absolute;top:0;right:0;bottom:0;width:64%;z-index:-1;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:var(--photo-op);filter:grayscale(1)}
.hero-photo::before{content:"";position:absolute;inset:0;background:var(--accent-2);mix-blend-mode:color;opacity:.3}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,transparent 60%),linear-gradient(0deg,var(--bg) 0%,transparent 30%)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,4vw,64px);align-items:end;min-height:clamp(470px,calc(100vh - 160px),640px);padding-top:clamp(22px,3vw,40px);padding-bottom:clamp(22px,3vw,40px)}
.hero-left{align-self:center}
.hero-left h1{font-size:clamp(1.9rem,3.2vw,3rem);line-height:1.05;letter-spacing:-.028em;margin:14px 0 18px}
.hero-left h1 em{display:block;font-style:normal;color:var(--accent-t)}
.codename{font-family:var(--mono);color:var(--accent-t);margin-bottom:6px}
.hero-sub{font-size:clamp(1rem,1.45vw,1.3rem);font-weight:600;line-height:1.3;max-width:36ch;margin-bottom:14px}
.hero-p{font-size:clamp(.95rem,1.15vw,1.08rem);font-weight:300;color:var(--ink2);max-width:48ch;line-height:1.65;margin-bottom:22px}
.hero-seg{margin-bottom:0}
.hero-right{min-width:0}
.glass{background:rgba(10,17,16,.88);border:1px solid var(--line2);border-radius:28px;padding:clamp(18px,2.2vw,30px);box-shadow:0 36px 90px -36px rgba(0,0,0,.7)}
html[data-theme="light"] .glass{background:rgba(255,255,255,.92);box-shadow:0 30px 70px -40px rgba(13,42,51,.35)}
.glass h2{font-size:clamp(1.3rem,2vw,1.85rem);margin:10px 0 20px;max-width:24ch}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:16px;border-radius:18px;background:var(--surface2);align-items:start}
.tile .n{width:44px;height:44px;border-radius:13px;border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--mono);font-size:.85rem;font-weight:500;color:var(--ink)}
.tile b{display:block;font-size:1.12rem;font-weight:650;line-height:1.2}
.tile p{color:var(--ink2);font-size:.95rem;font-weight:300;line-height:1.5;margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.stat{padding:16px 20px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}
.stat b{display:block;font-size:clamp(1.4rem,2.1vw,2rem);font-weight:700;color:var(--accent-t);line-height:1.1;letter-spacing:-.02em}
.stat span{display:block;margin-top:6px;color:var(--ink2);font-size:.92rem;font-weight:300;line-height:1.35}
.hub-sec{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,4vw,72px);align-items:center}
.hub-sec h2{font-size:clamp(1.4rem,2.1vw,1.9rem);margin:10px 0 10px}
.hubwrap{min-width:0}
.hub{display:block;width:100%;height:auto;max-width:540px;margin:0 auto;overflow:visible}
.hub .ring{fill:none;stroke:var(--line2);stroke-width:1.5}
.hub .ring.o{stroke-dasharray:2 7}
.hub .spoke{stroke:var(--accent);stroke-width:2.2;fill:none;stroke-dasharray:3 9;animation:flow 1.6s linear infinite}
.hub .core{fill:var(--surface2);stroke:var(--accent);stroke-width:2.5}
.hub .core-t{fill:var(--ink);font-weight:700;text-anchor:middle}
.hub .core-t.s2{font-weight:400}
.hub .node{cursor:pointer;outline:none}
.hub .node .disc{fill:var(--surface);stroke:var(--line2);stroke-width:2;transition:stroke .15s,fill .15s}
.hub .node:hover .disc,.hub .node:focus-visible .disc,.hub .node.on .disc{stroke:var(--accent);fill:var(--surface2)}
.hub .node.on .disc{stroke-width:3.5}
.hub .node .icu{color:var(--accent-t)}
.hub .node text{fill:var(--ink);font-weight:550;font-size:17px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.hub .arc{fill:var(--muted);font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase}
@keyframes flow{to{stroke-dashoffset:-24}}
.hub.intro .spoke{animation:draw .9s ease-out both,flow 1.6s linear .9s infinite}
@keyframes draw{from{stroke-dasharray:0 400}to{stroke-dasharray:3 9}}
.hub.intro .node{animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(.25s + var(--i)*.1s);transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.hubpanel{margin-top:16px;min-height:84px;padding:14px 18px;border:1px solid var(--line);border-radius:18px;background:var(--surface);max-width:46ch}
.hubpanel h3{font-size:1.1rem;margin-bottom:4px}
.hubpanel p{color:var(--ink2);font-size:.95rem;font-weight:300}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px;margin-top:22px}
.gl{padding:20px 22px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.gl dt{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.gl dd{margin-top:10px;font-size:1.28rem;font-weight:620;line-height:1.25;font-variant-numeric:tabular-nums}
.contents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 28px;margin-top:22px}
.contents h3{font-family:var(--mono);font-size:.74rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-t);margin-bottom:10px;line-height:1.5}
.contents a{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:14px 16px;margin-bottom:8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);text-decoration:none;transition:border-color .15s}
.contents a:hover{border-color:var(--accent)}
.contents .n{font-family:var(--mono);color:var(--accent-t);font-weight:500;font-size:.9rem;padding-top:2px}
.contents b{font-weight:620}
.contents small{display:block;color:var(--muted);font-size:.86rem;line-height:1.4;margin-top:3px;font-weight:300}

/* teams */
.lead-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:6px}
.lead-grid h3{font-size:1rem;margin-bottom:12px;font-weight:600}
.pairing{margin-top:32px;border:1px solid var(--line);border-radius:22px;background:var(--surface);overflow:hidden}
.pair-head,.pair-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,210px) minmax(0,1fr);align-items:stretch}
.pair-head>div{padding:15px 22px;font-weight:650}
.pair-head .hs{background:var(--solaris);color:#fff}.pair-head .hk{background:var(--teal-fill);color:#fff}
.pair-head .hb{background:var(--surface2)}
.pair-row{border-top:1px solid var(--line);min-height:66px}
.pair-row .l,.pair-row .r{padding:12px 22px;display:flex;align-items:center}
.pair-row .l{justify-content:flex-end;gap:8px}
.pair-row .mid{padding:10px;text-align:center;background:var(--surface2);border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;transition:background .15s}
.pair-row .mid b{display:block;line-height:1.2}
.pair-row .mid .g{display:block;color:var(--muted);font-size:.8rem;line-height:1.25;margin-top:2px;font-weight:300}
.pair-row:hover .mid{background:var(--teal-soft)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:20px;height:20px;border-radius:50%;display:inline-block;flex:none}
.dot.on{background:var(--teal)}
.dot.off{background:var(--teal);opacity:.45;width:14px;height:14px}
.dot.ph{border:2px dashed var(--ctl);background:transparent}
.cnt{font-size:.86rem;color:var(--muted);margin-left:4px;font-weight:350}
.keyline{display:flex;flex-wrap:wrap;gap:8px 24px;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface2);font-size:.86rem;color:var(--ink2)}
.keyline span{display:inline-flex;align-items:center;gap:8px}

/* governance */
.org{display:grid;gap:0;max-width:1120px}
.org-band{padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:22px;position:relative}
.org-band>h3{font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.org-band+.org-band{margin-top:26px}
.org-band+.org-band::before{content:"";position:absolute;left:50%;top:-26px;height:26px;width:2px;background:var(--line2)}
.org-row{display:flex;flex-wrap:wrap;gap:10px}
.org-box{padding:12px 16px;border-radius:14px;min-width:150px;flex:1 1 150px;color:#fff}
.org-box.s{background:var(--solaris)}.org-box.k{background:var(--teal-fill)}
.org-box b{display:block;font-weight:650;line-height:1.25}
.org-box small{display:block;margin-top:3px;font-size:.8rem;opacity:.9;font-weight:300}
.org-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.org-col{padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface2)}
.org-col>h3{font-size:1.02rem;margin-bottom:12px}
.org-col.s>h3{color:var(--solaris-t)}.org-col.k>h3{color:var(--accent-t)}
.org-col .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.org-role{padding:10px 12px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);line-height:1.25;transition:border-color .15s,background .15s}
.org-role b{display:block;font-size:.9rem;font-weight:620}
.org-role small{color:var(--muted);font-size:.8rem;font-weight:300}
.org-role.hl{border-color:var(--accent);background:var(--teal-soft)}
.rhythm{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center}
.wheel{width:100%;height:auto;max-width:380px}
.wheel .rg{opacity:1;transition:opacity .15s}
.wheel[data-f] .rg{opacity:.22}
.wheel[data-f="daily"] .rg.daily,.wheel[data-f="weekly"] .rg.weekly,.wheel[data-f="biweekly"] .rg.biweekly,.wheel[data-f="monthly"] .rg.monthly{opacity:1}
.wheel .track{fill:none;stroke:var(--line2);stroke-width:1.5}
.wheel .t-daily{fill:var(--accent-2)}.wheel .t-weekly{fill:var(--accent)}.wheel .t-biweekly{fill:var(--solaris-t)}.wheel .t-monthly{fill:var(--signal)}
.wheel text{fill:var(--muted);font-family:var(--mono);font-size:11px;text-anchor:middle}
.cad{display:grid;gap:0}
.cad button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:14px;padding:16px 8px;border-top:1px solid var(--line);width:100%}
.cad button:first-child{border-top:0}
.cad button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:10px}
.cad .ic{margin-top:2px;color:var(--accent-t);width:24px;height:24px}
.cad .tx{display:block}
.cad .h{display:block;font-size:1.05rem;font-weight:650;margin-bottom:2px;line-height:1.25}
.cad .fq{display:block;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-t);margin-bottom:4px}
.cad .p{display:block;color:var(--ink2);font-size:.95rem;font-weight:300}
.cad button:hover .h,.cad button.on .h{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px}
.g-ctl{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;margin-bottom:16px}
.emx{display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-rows:auto 1fr;gap:10px 16px;max-width:1160px}
.emx-head{grid-column:2;grid-row:1;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,1fr);gap:0 16px;padding:0 19px}
.eh{grid-row:1;display:block;padding:9px 14px;border-radius:12px;color:#fff;font-weight:700;text-align:center}
.eh.s{grid-column:2;background:var(--solaris)}.eh.k{grid-column:3;background:var(--teal-fill)}
.emx-path{grid-column:1;grid-row:2;position:relative;display:flex;align-items:center;justify-content:center;min-height:300px;background:var(--coral);clip-path:polygon(50% 0,100% 36px,72% 36px,72% 100%,28% 100%,28% 36px,0 36px)}
.ep-t{margin-top:40px;writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-size:.68rem;font-weight:650;letter-spacing:.3em;white-space:nowrap}
.ep-dot{position:absolute;left:0;right:0;top:0;height:60px;background:rgba(255,255,255,.3);transition:top .65s cubic-bezier(.5,0,.2,1),height .65s cubic-bezier(.5,0,.2,1)}
.emx-rows{grid-column:2;grid-row:2;list-style:none;margin:0;padding:0;display:grid;gap:26px}
.er{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,1fr);gap:0 16px;align-items:center;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;outline:none;transition:border-color .3s,background .3s,box-shadow .3s}
.er:hover,.er:focus-visible{border-color:var(--line2)}
.er.on{border-color:var(--coral);background:var(--coral-soft);box-shadow:0 14px 34px -26px var(--coral)}
.er-t{display:flex;align-items:center;gap:14px;min-width:0}
.er .lv{display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:50%;background:var(--coral);color:#fff;font-weight:700;font-size:1.15rem}
.er h3{font-size:1.04rem;line-height:1.2}
.er .er-t p{margin-top:3px;color:var(--ink2);font-size:.84rem;font-weight:300;line-height:1.35}
.er-c{position:relative;display:flex;flex-direction:column;justify-content:center;align-self:stretch;gap:8px}
.rb{padding:11px 14px;border-radius:10px;color:#fff;text-align:center;line-height:1.25}
.rb b{display:block;font-size:.96rem;font-weight:700}
.rb small{display:block;margin-top:3px;font-size:.8rem;font-weight:350;opacity:.9}
.rb.s{background:var(--solaris)}.rb.k{background:var(--teal-fill)}
.up{position:absolute;left:50%;top:-37px;width:30px;height:18px;margin-left:-15px;clip-path:polygon(50% 0,100% 62%,70% 62%,70% 100%,30% 100%,30% 62%,0 62%)}
.up.s{background:var(--solaris)}.up.k{background:var(--teal-fill)}
.esc-cap{margin-top:16px;min-height:3.4em;max-width:84ch;padding:14px 18px;border:1px solid var(--line);border-left:3px solid var(--signal);border-radius:6px 16px 16px 6px;background:var(--surface);color:var(--ink2)}
.esc-cap b{color:var(--ink)}
.roster details{border-top:1px solid var(--line)}
.roster details:last-child{border-bottom:1px solid var(--line)}
.roster summary{cursor:pointer;list-style:none;padding:16px 4px;font-weight:650;font-size:1.08rem;display:flex;align-items:center;gap:12px}
.roster summary::-webkit-details-marker{display:none}
.roster summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.roster details[open] summary::after{transform:rotate(-135deg)}
.roster ul{list-style:disc;padding:0 8px 18px 28px;color:var(--ink2);max-width:70ch;font-weight:300}
.roster li{margin:5px 0}
.roster li::marker{color:var(--accent)}

/* scope */
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pillar{padding:26px;border:1px solid var(--line);border-radius:24px;background:var(--surface)}
.pillar .big{width:60px;height:60px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;color:var(--accent-t);margin-bottom:18px;background:var(--teal-soft)}
.pillar .big .ic{width:28px;height:28px}
.pillar h3{font-size:1.28rem;margin-bottom:8px}
.pillar p{color:var(--ink2);font-weight:300}
.banner{margin-top:16px;display:flex;gap:16px;align-items:flex-start;padding:20px 26px;background:var(--surface2);color:var(--ink);border-radius:22px;border:1px solid var(--accent)}
.banner .ic{width:28px;height:28px;margin-top:2px;flex:none;color:var(--accent-t)}
.banner p{font-size:1.15rem;line-height:1.5;max-width:70ch;font-weight:400}
.areas{display:grid;gap:12px;margin-top:22px}
.area{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:14px 32px;padding:22px 26px;align-items:center;border:1px solid var(--line);border-radius:22px;background:var(--surface)}
.area h3{font-size:1.2rem;margin:8px 0 4px}
.area .ab{display:inline-block;padding:2px 11px;border-radius:99px;background:var(--teal-soft);color:var(--accent-t);font-family:var(--mono);font-weight:500;font-size:.74rem;letter-spacing:.1em;border:1px solid var(--line2)}
.area p{color:var(--ink2);font-size:.94rem;font-weight:300}
.chain{display:flex;flex-wrap:wrap;gap:14px 0}
.chain .st{width:98px;text-align:center;position:relative;font-size:.8rem;line-height:1.25;color:var(--ink2)}
.chain .st .c{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--line2);color:var(--accent-t);position:relative;z-index:1;transition:border-color .2s,background .2s,color .2s;transition-delay:calc(var(--i)*70ms)}
.chain .st .c .ic{width:21px;height:21px}
.chain .st+.st::before{content:"";position:absolute;top:23px;right:50%;width:100%;height:2px;background:var(--line2)}
.area:hover .st .c,.area:focus-within .st .c{border-color:var(--accent);background:var(--teal-soft)}
.cross{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}
.cross>div{padding:22px 26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}
.cross h3{display:flex;align-items:center;gap:12px;font-size:1.1rem;margin-bottom:10px}
.cross h3 .ic{color:var(--accent-t);width:22px;height:22px}
.cross ul{list-style:disc;padding-left:20px;color:var(--ink2);font-weight:300}
.cross li::marker{color:var(--accent)}
.sitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sit{padding:22px 26px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}
.sit h3{font-size:1.12rem}
.sit .sol{color:var(--muted);font-size:.84rem;margin:3px 0 10px;font-weight:300}
.sit table{width:100%;border-collapse:collapse;font-size:.94rem}
.sit td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top;font-weight:350}
.sit td.cd{width:58px;font-family:var(--mono);font-weight:500;color:var(--accent-t);font-size:.86rem}
.sit .kf{margin-top:10px;color:var(--ink2);font-size:.9rem;font-weight:300}
.arch-hint{display:none;margin-top:8px}
.arch-wrap{padding:14px;border:1px solid var(--line);border-radius:26px;background:var(--surface) radial-gradient(circle,var(--line) 1px,transparent 1.4px) 0 0/26px 26px;overflow-x:auto}
.arch{width:100%;min-width:960px;height:auto;display:block}
.arch .pr{fill:var(--surface2);stroke:var(--line2);stroke-width:1.5;transition:stroke .25s}
.arch .pn.core .pr{stroke:var(--accent);stroke-width:2}
.arch .pn.on .pr{stroke:var(--signal);stroke-width:2.5}
.arch .pchip{fill:var(--surface);stroke:var(--line2)}
.arch .pn .icu{color:var(--ink2)}
.arch .pt{font-weight:700;font-size:19px;fill:var(--ink)}
.arch .ps{font-size:12.5px;fill:var(--muted)}
.arch .foot{font-size:12px;fill:var(--muted);font-style:italic}
.arch .nr{fill:var(--surface);stroke:var(--line2);stroke-width:1.5;transition:stroke .25s,stroke-width .25s}
.arch .nd{transition:opacity .25s}
.arch .nd.on .nr{stroke:var(--signal);stroke-width:3}
.arch .sys .chip{fill:var(--c);fill-opacity:.16;stroke:var(--c);stroke-opacity:.55}
.arch .sys .icu{color:var(--c)}
.arch .nt{font-weight:700;font-size:19px;fill:var(--ink)}
.arch .nt.sm{font-size:16px}
.arch .ns{font-size:12.5px;fill:var(--muted)}
.arch .tg{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;fill:var(--signal-text)}
.arch .mod .nr{fill:var(--teal-fill);stroke:transparent}
.arch .mod.on .nr{stroke:var(--signal)}
.arch .chipw{fill:#fff;fill-opacity:.16}
.arch .mod .icu,.arch .btp .icu{color:#fff}
.arch .mt{font-weight:750;font-size:21px;fill:#fff}
.arch .ms{font-size:12.5px;fill:#fff;fill-opacity:.9}
.arch .btp .nr{fill:var(--teal-soft);stroke:var(--accent);stroke-opacity:.45}
.arch .btp .chipw{fill:var(--accent);fill-opacity:.22}
.arch .btp .icu{color:var(--accent-t)}
.arch .btp .nt{font-size:16px}
.arch .btp .ns{font-size:13px}
.arch .seam .nr{fill:var(--teal-soft);stroke:var(--accent);stroke-opacity:.5}
.arch .seam .icu{color:var(--accent-t)}
.arch .num{transition:opacity .25s}
.arch .num circle{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.arch .num text{font-size:13px;font-weight:750;fill:var(--on-accent);text-anchor:middle}
.arch .lb{transition:opacity .25s}
.arch .lb rect{fill:var(--surface);stroke:var(--line2);stroke-width:1.2;transition:stroke .25s}
.arch .lb text{font-size:12px;font-weight:620;fill:var(--ink2);text-anchor:middle}
.arch .lb .icu{color:var(--signal)}
.arch .lb.on rect{stroke:var(--signal)}
.arch .lb.on text{fill:var(--ink)}
.arch .eg{transition:opacity .25s}
.arch .ed{fill:none;stroke:var(--ctl);stroke-width:2.6;stroke-linecap:round;stroke-opacity:.8;marker-end:url(#arch-ar)}
.arch .ed.thin{stroke-width:1.8}
.arch .mk{fill:var(--ctl)}.arch .mk.on{fill:var(--signal)}
.arch .eg.on .ed{stroke:var(--signal);stroke-opacity:.5;marker-end:url(#arch-aron)}
.arch .edd{fill:none;stroke:var(--signal);stroke-width:3.4;stroke-dasharray:3 11;stroke-linecap:round;opacity:0}
.arch .eg.on .edd{opacity:.95;animation:flowa 1s linear infinite}
.arch .pkt{fill:var(--signal);opacity:0}
.arch .eg.on .pkt{opacity:1}
.arch.focus .nd:not(.on),.arch.focus .eg:not(.on),.arch.focus .lb:not(.on),.arch.focus .num:not(.on){opacity:.27}
.arch-ctl{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;margin:0 0 16px}
.arch-ctl .seg{margin:0}
.legend svg.lg{width:44px;height:12px;fill:none;stroke:var(--ctl);stroke-width:2.4;stroke-linecap:round}
.legend svg.lg .hd{fill:var(--ctl);stroke:none}
@media (max-width:1100px){.arch-hint{display:block}}
@media (prefers-reduced-motion:reduce){.arch .pkt{display:none}}
.arch-cap{min-height:74px;margin:0 0 18px;padding:16px 22px;border:1px solid var(--line);border-left:3px solid var(--signal);background:var(--surface);border-radius:6px 20px 20px 6px;max-width:90ch}
.arch-cap h3{font-size:1.05rem;margin-bottom:4px}
.arch-cap p{color:var(--ink2);font-weight:300}

/* method / road */
.roadwrap{position:relative;container-type:inline-size;overflow-x:auto;scrollbar-width:thin;padding:10px 0 0;border:1px solid var(--line);border-radius:26px;background:var(--surface)}
.road{width:100%;height:auto;display:block;overflow:visible}
.road-hint{display:none;margin-top:8px}
.road .bed{fill:none;stroke:var(--road);stroke-width:58;stroke-linecap:butt}
.road .edge{fill:none;stroke:var(--road-edge);stroke-width:66;stroke-linecap:butt}
.road .seg{fill:none;stroke-width:48;stroke-linecap:butt}
.road .center{fill:none;stroke:#fff;stroke-width:2.6;stroke-dasharray:10 15;opacity:.65}
.road.play .center{animation:flow2 .7s linear infinite}
@keyframes flowa{to{stroke-dashoffset:-14}}
@keyframes flow2{to{stroke-dashoffset:-25}}
.road .gp line{stroke:var(--ink);stroke-width:3.5}
.road .gp .cap{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.road .lbl{font-size:18px;font-weight:620;fill:var(--ink)}
.road .lbl2{font-size:14px;fill:var(--muted);font-family:var(--mono)}
.road .pn{font-size:17px;font-weight:750;fill:var(--o);stroke:var(--c);stroke-width:5px;paint-order:stroke;stroke-linejoin:round}
.road .live{fill:var(--ph5);stroke:var(--ink);stroke-width:2}
.road .me{fill:var(--signal);stroke:#fff;stroke-width:3}
.road .bub{fill:var(--accent)}
.road .bubt{fill:var(--on-accent);font-family:var(--mono);font-size:15px;font-weight:600;text-anchor:middle}
.road .leader{stroke:var(--line2);stroke-width:1.5}
/* the deliverables list sits in the road card, in the empty space above the road, and follows the car phase by phase */
.road-deliv{position:absolute;z-index:2;pointer-events:none;left:28px;top:24px;width:60%;left:2.2cqw;top:2.2cqw;width:60cqw}
.rd{--u:14px;font-size:var(--u);font-size:max(11px,1.08cqw);padding:1.25em 1.5em 1.35em;background:var(--surface);border:1px solid var(--line2);border-left:.4em solid var(--c);border-radius:1.1em;box-shadow:0 14px 40px -18px rgba(0,0,0,.55);animation:rdCard .4s both}
.rd-top{display:flex;align-items:baseline;flex-wrap:wrap;gap:.2em 1em}
.rd-top b{font-size:1.55em;font-weight:720;line-height:1.1}
.rd-n{font-family:var(--mono);font-size:.74em;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.rd-d{font-family:var(--mono);font-size:.86em;color:var(--ink2)}
.rd-h{font-family:var(--mono);font-size:.72em;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin:1em 0 .6em}
.rd-l{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5em,1fr));gap:.45em 1.3em}
.rd-l li{position:relative;padding-left:1.25em;line-height:1.3;animation:rdIn .45s both;animation-delay:calc(var(--k) * 80ms + 120ms)}
.rd-l li::before{content:"";position:absolute;left:0;top:.45em;width:.6em;height:.6em;border-radius:50%;background:var(--c)}
@keyframes rdCard{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes rdIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.road-ctl{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;margin:20px 0 8px}
.road-ctl input[type=range],.g-ctl input[type=range]{flex:1 1 220px;min-width:140px;accent-color:var(--accent);height:28px}
.readout{font-family:var(--mono);font-size:.9rem;font-weight:500;min-width:15em;color:var(--accent-t)}
.phasebar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
.phasebar button{appearance:none;text-align:left;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-top:5px solid var(--c);padding:12px 16px 14px;border-radius:16px;line-height:1.25}
.phasebar button b{display:block;font-weight:650}
.phasebar button span{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.phasebar button[aria-pressed="true"]{border-color:var(--c);background:var(--surface2)}
.phasepanel{margin-top:22px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px 48px;padding:26px 30px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:24px}
.phasepanel h2{font-size:1.6rem}
.phasepanel .dts{color:var(--ink2);margin:4px 0 16px;font-family:var(--mono);font-size:.9rem}
.phasepanel h3{font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
.phasepanel ul.dl{list-style:disc;padding-left:20px;font-weight:300}
.phasepanel li{margin:4px 0}
.phasepanel li::marker{color:var(--c)}
.phasepanel .gate{display:inline-flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:600}
.phasepanel .gate .ic{color:var(--c)}
.phasepanel .lk{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}

/* plan */
.gwrap{border:1px solid var(--line);border-radius:22px;background:var(--surface);overflow-x:auto;scrollbar-width:thin}
.gantt{--cw:26px;--lw:230px;--pw:150px;position:relative;width:calc(var(--pw) + var(--lw) + 32*var(--cw))}
.g-h1,.g-h2{display:grid;grid-template-columns:var(--pw) var(--lw) minmax(0,1fr)}
.gc{position:sticky;z-index:4;background:var(--surface);padding:14px 16px;font-weight:700;color:var(--accent-t)}
.gc-p{left:0}.gc-a{left:var(--pw)}
.g-months{display:grid;grid-template-columns:repeat(8,calc(4*var(--cw)))}
.g-months div{padding:14px 0;text-align:center;font-weight:700;color:var(--accent-t);font-size:.95rem}
.g-weeks{display:grid;grid-template-columns:repeat(32,var(--cw))}
.g-weeks div{text-align:center;font-family:var(--mono);font-size:.6rem;color:var(--muted);padding:4px 0 8px;border-left:1px solid var(--line)}
.g-weeks div:nth-child(4n+1){border-left-color:var(--line2)}
.g-h2 .gc{padding:0}
.g-grp{display:grid;grid-template-columns:var(--pw) minmax(0,1fr);border-top:1px solid var(--line2)}
.g-phase{position:sticky;left:0;z-index:3;background:var(--surface);padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border-right:1px solid var(--line)}
.g-phase .pic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft);color:var(--accent-t);border:1px solid var(--line2)}
.g-phase b{font-size:1.02rem;line-height:1.15}
.g-phase small{font-family:var(--mono);font-size:.62rem;color:var(--muted);line-height:1.35}
.g-rows{min-width:0}
.g-row{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);height:34px;border-top:1px solid var(--line)}
.g-row:first-child{border-top:0}
.g-label{position:sticky;left:var(--pw);z-index:3;background:var(--surface);padding:0 12px 0 16px;display:flex;align-items:center;font-size:.86rem;font-weight:350;line-height:1.15;color:var(--ink2)}
.g-track{position:relative;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:var(--cw) 100%}
.g-bar{position:absolute;top:9px;height:16px;border-radius:99px;background:var(--accent);opacity:.9;border:0;padding:0;cursor:pointer;min-width:8px}
.g-bar.hc{background:linear-gradient(90deg,var(--accent),var(--ph5))}
.g-bar.gate{width:13px;min-width:0;height:13px;top:10.5px;border-radius:3px;transform:rotate(45deg);background:var(--ph5);opacity:1}
.g-bar:hover,.g-bar.sel{opacity:1;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.g-bar .gu{position:absolute;top:2px;width:12px;height:12px;color:var(--on-accent)}
.g-bar .gu svg{display:block;width:12px;height:12px;fill:currentColor}
.legend svg.pp{width:14px;height:14px;fill:currentColor}
.g-live{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ink2);opacity:.75;z-index:2;pointer-events:none}
.g-live span{position:absolute;top:50px;left:0;transform:translateX(-50%);padding:3px 10px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-family:var(--mono);font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.g-play{position:absolute;top:0;bottom:0;width:2px;background:var(--signal);z-index:5;pointer-events:none}
.g-play::before{content:"";position:absolute;top:-1px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--signal)}
.g-now{margin:16px 0 0;padding:14px 20px;border:1px solid var(--line);border-left:3px solid var(--signal);background:var(--surface);border-radius:6px 18px 18px 6px;font-size:.95rem;min-height:56px;font-weight:300}
.g-now b{font-family:var(--mono);font-weight:500;font-size:.9rem}
.g-detail{margin-top:14px;padding:16px 22px;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px 18px 18px 6px;background:var(--surface)}
.g-detail h3{font-size:1.08rem}
.g-detail p{color:var(--ink2);font-size:.94rem;margin-top:3px;font-weight:300}
.eng{border:1px solid var(--line);border-radius:22px;background:var(--surface);overflow-x:auto}
.eng-in{min-width:780px}
.eng-h,.eng-r{display:grid;grid-template-columns:150px 58px minmax(0,1fr)}
.eng-h>div{padding:14px 8px 14px 16px;background:var(--surface2);color:var(--accent-t);font-weight:700;font-size:.92rem}
.eng-h .wk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0;background:none}
.eng-h .wk div{padding:14px 12px;text-align:center;border-left:1px solid var(--line);background:var(--surface2);font-family:var(--mono);font-size:.8rem}
.eng-r{border-top:1px solid var(--line)}
.eng-ph{padding:12px 14px;border-left:6px solid var(--c);font-weight:700;line-height:1.2}
.eng-ph small{display:block;font-weight:350;color:var(--muted);font-size:.74rem;font-family:var(--mono);margin-top:3px}
.eng-m{display:grid;place-items:center;font-family:var(--mono);font-weight:500;color:var(--muted);font-size:.82rem;background:var(--surface2)}
.eng-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(54px,auto);gap:8px;padding:8px}
.ec{border-radius:14px;padding:9px 12px;font-size:.82rem;line-height:1.3;border:1.5px solid var(--c);background:var(--surface2)}
.ec b{display:block;font-weight:650;font-size:.84rem}
.ec span{color:var(--ink2);font-weight:300}
.ec.ms{background:var(--cream);border-color:var(--ph5)}
.ec.ms b::before{content:"\2605";margin-right:6px;color:var(--ph5)}
.ec.none{background:transparent;border:1px dashed var(--line)}
.ec.data{background:var(--teal-fill);border-color:var(--teal-fill);color:#fff;text-align:center;padding:4px 8px;min-height:0;font-weight:600;font-size:.76rem;align-self:start;border-radius:99px}

/* gates */
.gaterows{display:grid;gap:14px}
.grow{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:24px;background:var(--surface);overflow:hidden}
.gph{background:var(--c);color:var(--o,#fff);padding:20px 18px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.gph h2{font-size:1.5rem;color:inherit}
.gph .gd{font-size:.82rem;line-height:1.35;font-family:var(--mono);margin-top:6px}
.gate-arm{position:relative;height:34px}
.gate-arm i{position:absolute;left:0;bottom:0;width:6px;height:30px;background:currentColor;border-radius:2px;opacity:.9}
.gate-arm b{position:absolute;left:3px;bottom:26px;height:5px;width:92px;background:currentColor;border-radius:2px;transform-origin:left center;transition:transform .5s cubic-bezier(.5,0,.2,1)}
.grow.open .gate-arm b{transform:rotate(-72deg)}
.gcol{padding:20px 22px 16px}
.gcol+.gcol{border-left:1px solid var(--line)}
.gcol h3{font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;line-height:1.5}
.gcol h3 .pg{color:var(--accent-t)}
.crit{display:flex;gap:12px;align-items:flex-start;padding:7px 0;cursor:pointer;line-height:1.4;position:relative}
.crit input{position:absolute;opacity:0;width:1px;height:1px}
.crit .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--ctl);flex:none;margin-top:1px;display:grid;place-items:center;color:var(--o,#fff);background:transparent}
.crit .bx .ic{width:14px;height:14px;stroke-width:3;opacity:0}
.crit input:checked + .bx{background:var(--c);border-color:var(--c)}
.crit input:checked + .bx .ic{opacity:1}
.crit input:focus-visible + .bx{outline:2px solid var(--focus);outline-offset:2px}
.crit input:checked ~ span.tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.tools{display:flex;gap:12px;align-items:center;margin:22px 0 16px;flex-wrap:wrap}

/* risks */
.rstrip{display:grid;grid-template-columns:minmax(0,1.35fr) repeat(5,minmax(0,.42fr));gap:6px;margin:8px 0 4px}
.rstrip div[data-p]{border-top:6px solid var(--c);padding:8px 2px 0;font-size:.86rem;transition:opacity .2s;line-height:1.25;font-weight:600}
.rstrip .blank{border:0}
.rstrip div b{display:block}
.rstrip div span{color:var(--muted);font-size:.74rem;font-family:var(--mono);font-weight:400}
.rstrip[data-f] div[data-p]{opacity:.28}
.rstrip[data-f] div[data-p].on{opacity:1}
.risks{display:grid;gap:0}
.risk{display:grid;grid-template-columns:minmax(0,1.35fr) repeat(5,minmax(0,.42fr));gap:6px;padding:20px 8px;border-top:1px solid var(--line);align-items:center;cursor:pointer;border-radius:0;transition:background .15s}
.risks .risk:last-child{border-bottom:1px solid var(--line)}
.risk h3{font-size:1.12rem}
.risk h3 button{all:unset;cursor:pointer}
.risk h3 button:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.risk p{color:var(--ink2);margin-top:4px;max-width:68ch;font-weight:300}
.risk .rd{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);background:transparent;display:block;justify-self:center}
.risk .rd.on{background:var(--c);border-color:var(--c)}
.risk>div:first-child{padding-right:18px}
.risk:hover,.risk.sel{background:var(--surface)}
.risk.sel h3 button{text-decoration:underline;text-decoration-color:var(--signal);text-underline-offset:5px;text-decoration-thickness:2px}

/* next */
.nextup{display:flex;align-items:center;gap:14px;padding:16px 22px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);max-width:660px}
.nextup .ic{color:var(--signal);width:26px;height:26px}
.nextup b{font-weight:650}
.dates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative;margin-top:30px}
.dates::before{content:"";position:absolute;left:0;right:0;top:11px;height:3px;background:var(--line2)}
.dates li{position:relative;padding:34px 12px 0 0}
.dates li::before{content:"";position:absolute;top:4px;left:0;width:17px;height:17px;border-radius:50%;background:var(--bg);border:3px solid var(--c)}
.dates li.nx::before{background:var(--signal);border-color:var(--signal)}
.dates .d{font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums;line-height:1.1}
.dates .y{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.dates .t{margin-top:8px;font-size:.9rem;color:var(--ink2);line-height:1.3;font-weight:300}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px 56px}
.twocol h2{font-size:1.5rem;margin-bottom:4px}
.twocol .sub{color:var(--ink2);margin:0 0 18px;max-width:52ch;font-weight:300}
.todo li{border-top:1px solid var(--line)}
.todo li:last-child{border-bottom:1px solid var(--line)}
.todo .crit{padding:12px 4px}
.asks{display:grid;gap:12px}
.ask{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:20px 24px;border:1.5px solid var(--line);border-radius:22px;background:var(--surface);transition:border-color .2s,background .2s}
.ask.ok{border-color:var(--accent);background:var(--teal-soft)}
.ask h3{font-size:1.12rem}
.ask p{color:var(--ink2);font-weight:300}
.ask button{appearance:none;border:1.5px solid var(--line2);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-width:160px;justify-content:center}
.ask.ok button{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.asum{margin-top:12px;color:var(--ink2);font-family:var(--mono);font-size:.84rem}

/* scope: modules and GSIs */
.mods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:28px}
.mod{display:flex;flex-direction:column;gap:12px;padding:20px;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s}
.mod:hover,.mod:focus-visible{border-color:var(--accent);background:var(--surface2)}
.mod .mtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.mod .ab,.modhero .ab{display:inline-block;padding:2px 11px;border-radius:99px;background:var(--teal-soft);color:var(--accent-t);font-family:var(--mono);font-weight:500;font-size:.74rem;letter-spacing:.1em;border:1px solid var(--line2)}
.mod .mini{display:flex;gap:4px;flex-wrap:wrap}
.mod .mi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line2);color:var(--accent-t)}
.mod .mi .ic{width:14px;height:14px}
.mod h3{font-size:1.2rem}
.mod p{color:var(--ink2);font-size:.92rem;font-weight:300;flex:1}
.mod .mfoot{font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;color:var(--accent-t);border-top:1px solid var(--line);padding-top:12px}
.mod .mfoot b{font-size:1.1rem;font-weight:600}
.modnav{display:inline-flex;gap:4px;padding:6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);margin:4px 0 28px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.modnav a{padding:9px 20px;border-radius:999px;color:var(--ink2);text-decoration:none;font-weight:500;white-space:nowrap}
.modnav a:hover{color:var(--ink)}
.modnav a[aria-current]{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 30px -10px var(--glow)}
.modhero{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:28px 40px;align-items:center;padding:30px 34px;border:1px solid var(--line);border-radius:26px;background:var(--surface)}
.modhero h2{font-size:1.5rem;margin:12px 0 8px}
.chain.big .st{width:124px;font-size:.88rem}
.chain.big .st .c{width:60px;height:60px;margin-bottom:10px}
.chain.big .st .c .ic{width:26px;height:26px}
.chain.big .st+.st::before{top:29px}
.gsis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.gsi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.gsi .gc{font-family:var(--mono);font-weight:600;font-size:1rem;color:var(--accent-t);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;min-width:68px;text-align:center;background:var(--teal-soft)}
.gsi b{font-weight:600;line-height:1.3}
.feats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.feat{display:flex;gap:14px;align-items:center;padding:18px 22px;border-radius:18px;background:var(--surface2);border:1px solid var(--line);font-size:1.05rem}
.feat .ic{color:var(--accent-t);width:24px;height:24px}
.modpager{display:flex;justify-content:space-between;gap:14px;margin-top:32px}
.modpager a{display:flex;align-items:center;gap:14px;color:var(--ink);text-decoration:none;font-weight:600;padding:12px 22px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.modpager a small{display:block;color:var(--muted);font-weight:350;font-size:.74rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.modpager a:hover{border-color:var(--accent)}
.modpager .nx{margin-left:auto;text-align:right}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:28px}
.two>section{padding:26px 30px;border:1px solid var(--line);border-radius:24px;background:var(--surface)}
.two h2{font-size:1.3rem;margin:8px 0 14px}
.bul{list-style:disc;padding-left:20px;color:var(--ink2);font-weight:300}
.bul li{margin:6px 0}.bul li::marker{color:var(--accent)}
.iplan{display:grid;gap:12px}
.iplan>li{padding:2px 0 2px 16px;border-left:4px solid var(--c)}
.iplan .ih{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.iplan .ih b{font-weight:650}.iplan .ih span{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.iplan ul{list-style:disc;padding-left:18px;color:var(--ink2);font-weight:300;margin-top:4px}
.iplan ul li::marker{color:var(--c)}
.callout{display:flex;gap:14px;align-items:flex-start;margin-top:18px;padding:18px 24px;border:1px solid var(--signal);border-left-width:5px;background:var(--signal-soft);border-radius:6px 20px 20px 6px}
.callout .ic{color:var(--signal-text);width:24px;height:24px;margin-top:2px}
.callout p{color:var(--ink)}

/* hero panels, keys, phase panel, launchpad, values, banner */
.stats.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mini-h{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:20px 0 0}
.card-lead{font-size:1.03rem;line-height:1.62;color:var(--ink);margin:12px 0 2px;font-weight:350}
.mini-h + .tiles{margin-top:12px}
.glass .tile p{font-size:.92rem}
.card-note{margin-top:14px;font-size:.84rem;color:var(--muted);font-weight:300}
.tile .n .ic{width:20px;height:20px;color:var(--accent-t)}
.keyhint{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink2);cursor:pointer;font-size:.9rem}
.keyhint:hover{border-color:var(--accent);color:var(--ink)}
.keys{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(2,10,8,.68);padding:20px}
.keys[hidden]{display:none}
.keys-card{width:min(580px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line2);border-radius:26px;padding:24px 28px 14px;box-shadow:0 40px 100px -30px rgba(0,0,0,.7)}
.keys-card .kh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.keys-card h2{font-size:1.5rem}
.keys-card dl>div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.keys-card dd{color:var(--ink2);font-size:.95rem;font-weight:300}
kbd{display:inline-block;min-width:32px;padding:3px 10px;margin-right:5px;border:1px solid var(--line2);border-bottom-width:3px;border-radius:9px;background:var(--surface2);font-family:var(--mono);font-size:.84rem;text-align:center;color:var(--ink)}
.dscrim{position:fixed;inset:0;z-index:84;background:rgba(2,10,8,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.dscrim[data-open="true"]{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:85;background:var(--surface);border-left:1px solid var(--line2);box-shadow:-30px 0 80px -30px rgba(0,0,0,.6);transform:translateX(104%);visibility:hidden;transition:transform .25s,visibility 0s .25s;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px))}
.drawer[data-open="true"]{transform:none;visibility:visible;transition:transform .25s}
.drawer .dhead{display:flex;justify-content:space-between;align-items:center;padding:0 26px 12px}
.drawer .dbody{overflow-y:auto;padding:0 26px 16px;flex:1;border-left:6px solid var(--c);margin-left:20px;padding-left:20px}
.drawer h2{font-size:1.8rem}
.drawer .dts{font-family:var(--mono);font-size:.86rem;color:var(--ink2);margin:4px 0 12px}
.drawer .gate{display:inline-flex;align-items:center;gap:10px;font-weight:600;margin-bottom:10px}
.drawer .gate .ic{color:var(--c)}
.drawer h3{font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.drawer ul.dl{list-style:disc;padding-left:20px;font-weight:300;font-size:.95rem}
.drawer li{margin:4px 0}.drawer li::marker{color:var(--c)}
.drawer li.hit{font-weight:600;color:var(--ink)}
.drawer .dnav{display:flex;justify-content:space-between;gap:10px;padding:14px 26px 0;border-top:1px solid var(--line)}
.g-phase{cursor:pointer;transition:background .2s}
.g-phase:hover,.g-phase.on,.g-phase.sel{background:var(--teal-soft)}
.g-bar.up{opacity:.2}
.g-bar.live{opacity:1;filter:brightness(1.22)}
.lp{border:1px solid var(--line);border-radius:24px;background:var(--surface);overflow:hidden}
.lp-bar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--surface2);border-bottom:1px solid var(--line)}
.lp-home{font-weight:650}
.lp-search{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border:1px solid var(--line2);border-radius:99px;color:var(--muted);font-size:.86rem}
.lp-av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.lp-av .ic{width:16px;height:16px}
.lp-body{padding:22px 24px 26px}
.lp-body h3{font-size:1.4rem}
.lp-sub{color:var(--muted);font-size:.92rem;margin:2px 0 16px;font-weight:300}
.lp-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:20px}
.lp-card{display:flex;gap:12px;align-items:center;padding:13px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}
.lp-card .ic{color:var(--accent-t);width:22px;height:22px}
.lp-card b{display:block;font-size:.95rem}.lp-card span{font-size:.78rem;color:var(--muted);font-weight:300}
.lp-h{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.lp-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.lp-tile{padding:16px;border:1px solid var(--line2);border-radius:16px;background:var(--surface2);display:flex;flex-direction:column;gap:10px;min-height:118px}
.lp-tile .ic{color:var(--accent-t);width:24px;height:24px}
.lp-tile b{font-size:.93rem;line-height:1.25;font-weight:600}
.lp-tile small{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-top:auto}
.lp.play .lp-tile{animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*110ms)}
.vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.val{padding:22px 24px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}
.val .n{font-family:var(--mono);font-size:.8rem;color:var(--accent-t);border:1px solid var(--line2);border-radius:10px;padding:4px 10px;display:inline-block;margin-bottom:12px}
.val h3{font-size:1.2rem;margin-bottom:6px}.val p{color:var(--ink2);font-weight:300}
.banner-photo{position:relative;min-height:200px;border-radius:28px;overflow:hidden;border:1px solid var(--line);margin:30px 0 0;display:flex;align-items:flex-end;background-size:cover;background-position:center 45%;filter:grayscale(1) contrast(1.05)}
.banner-photo::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,17,16,.94) 0%,rgba(10,17,16,.15) 75%)}
.banner-photo figcaption{position:relative;padding:26px 32px;color:#fff;display:flex;flex-direction:column;gap:4px;filter:none}
.banner-photo figcaption b{font-size:1.5rem;letter-spacing:-.01em}
.banner-photo figcaption span{font-weight:300;font-size:1.05rem;color:#E4ECE8}
@media (hover:none){.keyhint{display:none}}

/* scope explorer: layered view + pills */
.explore{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:18px;margin-top:6px;align-items:stretch}
.iso-card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;background:var(--surface);display:flex;flex-direction:column;min-height:640px}
.iso-bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(7px) grayscale(1);opacity:.55;transform:scale(1.08)}
.iso-card::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 30%,var(--surface) 100%);opacity:.3;pointer-events:none}
.iso-wrap{position:relative;z-index:1;flex:1;display:grid;place-items:center;padding:14px 8px 0;overflow:hidden}
.iso{width:100%;height:auto;max-width:720px;display:block}
.iso-hint{position:relative;z-index:1;padding:6px 24px 20px;color:var(--muted);font-size:.88rem}
.iso-plane{fill:var(--surface);fill-opacity:.8;stroke:var(--line2);stroke-width:1.7}
.iso-g.base .iso-plane{stroke:var(--solaris-t)}
.iso-t{font-size:25px;font-weight:700;fill:var(--ink)}
.iso-t.big{font-size:30px}
.iso-tt{font-size:25px;font-weight:700;fill:var(--ink)}
.iso-s{font-family:var(--mono);font-size:13px;letter-spacing:.13em;fill:var(--muted)}
.iso-codes{font-family:var(--mono);font-size:16px;letter-spacing:.05em;fill:var(--accent-t);font-weight:600}
.iso-g.hit{cursor:pointer;outline:none}
.iso-g.hit .iso-plane{stroke:var(--accent-t);transition:fill .2s,fill-opacity .2s}
.iso-g.hit:hover .iso-plane,.iso-g.hit:focus-visible .iso-plane{fill:var(--accent);fill-opacity:.3}
.iso-g.sel .iso-plane{fill:var(--accent);fill-opacity:1;stroke:var(--accent)}
.iso-g.sel .iso-t,.iso-g.sel .iso-tt{fill:var(--on-accent)}
.iso-g.sel .iso-s{fill:var(--on-accent);opacity:.9}
.lift.up{animation:liftUp .38s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes liftUp{from{transform:translateY(0)}to{transform:translateY(-14px)}}
.ex-panel{border:1px solid var(--line);border-radius:30px;background:var(--surface);padding:28px 32px 30px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.pill{appearance:none;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);border-radius:999px;padding:9px 17px;font-weight:600;font-size:.95rem;cursor:pointer;transition:background .15s,border-color .15s}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 8px 28px -10px var(--glow)}
.ex-h{font-size:clamp(1.4rem,2.3vw,2.1rem);margin:8px 0 10px}
.ex-scope{color:var(--ink2);font-weight:300;font-size:1.08rem;margin-bottom:16px}
.chain.mini2{margin:4px 0 6px}
.chain.mini2 .st{width:92px;font-size:.78rem}
.chain.mini2 .st .c{width:42px;height:42px}
.chain.mini2 .st .c .ic{width:19px;height:19px}
.chain.mini2 .st+.st::before{top:20px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px;margin:18px 0 24px}
.gcard{padding:18px 18px 22px;border:1px solid var(--line);border-radius:20px;background:var(--surface2)}
.gcard small{display:block;font-family:var(--mono);font-size:.82rem;letter-spacing:.14em;color:var(--accent-t);margin-bottom:12px}
.gcard b{display:block;font-size:1.15rem;line-height:1.25;font-weight:650}
.ex-panel .feats{margin:12px 0 16px}
.ex-note{color:var(--muted);font-size:.86rem;font-weight:300;max-width:60ch}

/* team introduction cards */
.team-seg{margin-top:30px;margin-bottom:0}
.tpanel .sec{margin-top:34px}
.tpanel > .sec{animation:tfade .35s both}
@keyframes tfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.pcs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:12px 0 30px}
.pc{padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.pc small{display:block;color:var(--muted);font-size:.84rem;font-weight:350;margin-bottom:6px}
.pc b{display:block;font-size:1.12rem;line-height:1.25;font-weight:650;overflow-wrap:anywhere}
.wcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.wc{padding:20px 22px 22px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.wc h4{font-size:1.28rem;margin-bottom:10px}
.wc .ln{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:12px}
.wc .d{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.wc .d.on{background:var(--teal)}.wc .d.off{background:var(--accent-t)}.wc .d.ph{background:transparent;border:1.5px dashed var(--ctl);width:9px;height:9px}
.wc .nm{font-size:1.08rem;font-weight:650;line-height:1.3;margin-top:3px;overflow-wrap:anywhere}
.wc .nm.lt{font-weight:400}
.tbd{color:var(--accent-t);font-style:italic;font-weight:700}
.pc.ph,.wc.ph{border-style:dashed;background:transparent}
.pc.ph b,.wc.ph .nm{color:var(--muted);font-weight:500}

/* Omega and Solaris team: leadership, steering committee, BPOs and SMEs */
.pcs.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pcs.n6{grid-template-columns:repeat(6,minmax(0,1fr))}
.pcs.n6 .pc{padding:16px 14px}
.pcs.n6 .pc small{font-size:.8rem}
.pcs.n6 .pc b{font-size:clamp(.92rem,1.02vw,1.06rem)}
.pc .pos{display:block;margin-top:7px;color:var(--ink2);font-size:.9rem;font-weight:350;line-height:1.3;font-style:normal}
.org{display:inline-block;margin-top:8px;padding:2px 10px;border:1px solid var(--line2);border-radius:99px;background:var(--surface2);font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;line-height:1.5}
.org.omega{color:var(--accent-t)}.org.solaris{color:var(--solaris-t)}
.scs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0 30px}
.sc{padding:15px 18px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.sc b{display:block;font-size:1.05rem;font-weight:650;line-height:1.25}
.sc>span:not(.org){display:block;margin-top:4px;color:var(--ink2);font-size:.9rem;line-height:1.3}
.sc .tbd{display:block;margin-top:4px;font-size:.9rem}
.bpos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0 30px}
.bp{padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.bp small{display:block;color:var(--muted);font-size:.84rem;font-weight:350;margin-bottom:6px;line-height:1.3}
.bp b{display:block;font-size:1.12rem;line-height:1.25;font-weight:650}


/* the deep foundation parallel: large drawings behind the road, a caption band underneath */
:root{--grd:#c9a46a;--coral:#E0775A;--coral-soft:rgba(224,119,90,.13)}
html[data-theme="light"]{--grd:#9a7440;--coral:#D16349;--coral-soft:rgba(209,99,73,.1)}
.fd-e0{stop-color:var(--grd);stop-opacity:.2}.fd-e1{stop-color:var(--grd);stop-opacity:.02}
.fd-gl{fill:none;stroke:var(--ink2);stroke-width:1.8;stroke-opacity:.4}
.fd-str{fill:none;stroke:var(--ink2);stroke-width:1.2;stroke-opacity:.16;stroke-dasharray:2 8;stroke-linecap:round}
.fd-band{fill:var(--surface2)}
.fd-bl{fill:none;stroke:var(--line2);stroke-width:1.5}
.fd-s{opacity:0;transition:opacity .8s}.fd-s.on{opacity:.85}
.road{--so:.5}.road.play{--so:.82}
.fd-s path,.fd-s rect,.fd-s circle,.fd-s ellipse{fill:none;stroke:var(--ink2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:var(--so);transition:stroke-opacity .6s;vector-effect:non-scaling-stroke}
.fd-s .a{stroke:var(--c);stroke-opacity:.95;stroke-width:2.4}
.fd-s .dim{stroke-opacity:calc(var(--so) * .55)}
.fd-s .d{stroke-dasharray:7 7}
.fd-s .f{fill:var(--c);fill-opacity:.22;stroke:var(--c);stroke-opacity:.75}
.fd-s .m{fill:var(--ink2);fill-opacity:.28;stroke:none}
.road.play .fd-s .f{fill-opacity:.3}
.fd-s .h{fill:var(--surface);stroke:none}
.road-found,.fd-chips{position:absolute;z-index:2;pointer-events:none;bottom:12px;bottom:1cqw;height:9cqw;font-size:var(--u,13px);font-size:max(10px,1.02cqw)}
.road-found{left:28px;left:2.2cqw;width:56cqw}
.fd-chips{right:28px;right:2.2cqw;width:36cqw}
.fd-row{display:flex;flex-wrap:wrap;gap:.4em .5em;margin:.25em 0 .6em}
.fd-row span{display:inline-flex;align-items:center;gap:.5em;padding:.2em .8em .2em .26em;border:1px solid var(--line2);border-radius:99px;background:var(--surface);color:var(--muted);font-size:.86em;line-height:1.25;white-space:nowrap}
.fd-row i{display:grid;place-items:center;width:1.55em;height:1.55em;border:1.5px solid var(--c);border-radius:50%;font-style:normal;font-family:var(--mono);font-size:.82em;color:var(--ink2)}
.fd-row .on{color:var(--ink);font-weight:650;border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.fd-row .on i{background:var(--c);color:#fff}
.fd-h{margin:.35em 0 .3em;font-size:1.5em;font-weight:720;line-height:1.1;color:var(--t,var(--ink));animation:rdCard .45s both}
.fd-h span{color:var(--muted);font-weight:350;font-size:.68em;margin-right:.15em}
.fd-p{margin:0;line-height:1.42;color:var(--ink2);animation:rdCard .5s .08s both}
.fd-q{margin:0;font-size:.88em;color:var(--muted);font-style:italic;line-height:1.35}
.fnd-note{margin:14px 0 4px;max-width:58ch;color:var(--ink2);font-size:.95rem;line-height:1.5}
.fnd-note b{color:var(--ink)}

/* presentation mode */
html.presenting{font-size:clamp(16px,calc(16px + (100vw - 1280px) * .0062),20px);scroll-padding-top:24px}
html.presenting .top,html.presenting .pager,html.presenting .scrim{display:none!important}
html.presenting .wrap{max-width:min(1680px,94vw)}
html.presenting .view{padding-top:clamp(16px,3vh,36px)}
html.presenting.idle{cursor:none}
.pbar{position:fixed;z-index:95;left:0;right:0;top:0;height:4px}
.pbar[hidden],.hud[hidden]{display:none}
.pbar i{display:block;width:0;height:100%;background:var(--accent);transition:width .45s}
.hud{position:fixed;z-index:95;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:calc(100vw - 24px);padding:8px 10px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);box-shadow:0 22px 60px -22px rgba(0,0,0,.65);font-size:14px;transition:opacity .35s,transform .35s}
html.idle .hud{opacity:0;transform:translate(-50%,18px);pointer-events:none}
.hud .hb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:40px;padding:0 12px;border:1px solid var(--line2);border-radius:999px;background:var(--surface2);color:var(--ink);font:inherit;cursor:pointer}
.hud .hb:hover{border-color:var(--accent)}
.hud .hx{padding:0 16px}
.hud .hm{display:grid;gap:2px;min-width:0;padding:0 6px;text-align:center}
.hud .hm b{max-width:34ch;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:.98rem}
.hud .hm span{white-space:pre;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--muted)}
.hud .hd{display:flex;gap:7px}
.hud .hd button{width:11px;height:11px;padding:0;border:1.5px solid var(--ctl);border-radius:50%;background:transparent;cursor:pointer}
.hud .hd button.on{border-color:var(--accent);background:var(--accent)}
@media (max-width:719px){.hud .hd,.hud .hm span{display:none}}

}

  .brand{grid-area:brand;min-width:0}

  .nav{grid-area:nav;position:relative;margin:0;padding:0 0 10px;overflow-x:auto;scrollbar-width:none}

}

  .phasebar{grid-template-columns:repeat(5,minmax(122px,1fr));overflow-x:auto}
  .pillars{grid-template-columns:minmax(0,1fr)}

}

  .bdiv{height:24px}.kt{height:15px}

<script>
(function () {
"use strict";
const D = window.PORTAL_DATA, LOGO = window.PORTAL_LOGOS || {};
const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ic = (id, cls) => `<svg class="ic${cls ? " " + cls : ""}" aria-hidden="true" focusable="false"><use href="#i-${id}"/></svg>`;
const icu = (id, x, y, s) => `<use class="icu" href="#i-${id}" x="${x}" y="${y}" width="${s}" height="${s}"/>`;
const store = { get(k) { try { return localStorage.getItem("sk." + k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem("sk." + k, v); } catch (e) {} } };
const rep = (n, s) => new Array(Math.max(0, n) + 1).join(s);
const pol = (cx, cy, r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
const f1 = n => n.toFixed(1);

/* dates */
const DAY = 86400000, MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const dUTC = iso => { const p = iso.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); };
const fmt = (ms, y) => { const d = new Date(ms); return MON[d.getUTCMonth()] + " " + d.getUTCDate() + (y ? ", " + d.getUTCFullYear() : ""); };
const T0 = dUTC(D.road.start), TN = Math.round((dUTC(D.road.end) - T0) / DAY);
const dayOf = iso => Math.round((dUTC(iso) - T0) / DAY);
const PH = D.phases.map((p, i) => Object.assign({}, p, { i, ds: dayOf(p.start), de: dayOf(p.end), c: `var(--ph${i + 1})`, ct: `var(--ph${i + 1}t)` }));
const phaseAtDay = d => PH.find(p => d >= p.ds && d <= p.de) || null;
const range = p => fmt(dUTC(p.start)) + " to " + fmt(dUTC(p.end));
D.agenda.forEach(a => { a.head = D.heads[a.id]; });

const SK = window.SK = { D, RM, $, $$, esc, ic, icu, store, rep, pol, f1, DAY, MON, dUTC, fmt, T0, TN, dayOf, PH, phaseAtDay, range };

/* shared fragments */
SK.brand = () => `${LOGO.omega ? `<span class="plate-o logo" role="img" aria-label="Omega, a Solaris company"><img src="data:image/png;base64,${LOGO.omega}" alt="" width="${LOGO.omega_w}" height="${LOGO.omega_h}"></span>` : '<span class="plate-o" role="img" aria-label="Omega">OMEGA</span>'}<span class="plate-s"><img src="data:image/png;base64,${LOGO.solaris}" alt="Solaris Energy Infrastructure" width="${LOGO.solaris_w}" height="${LOGO.solaris_h}"></span><span class="bdiv" aria-hidden="true"></span><img class="kt kt-w" src="data:image/png;base64,${LOGO.kaartech_white}" alt="KaarTech" width="${LOGO.kaartech_w}" height="${LOGO.kaartech_h}"><img class="kt kt-b" src="data:image/png;base64,${LOGO.kaartech}" alt="" aria-hidden="true" width="${LOGO.kaartech_w}" height="${LOGO.kaartech_h}">`;
SK.vhead = v => `<header class="vh"><h1>${esc(v.head).replace(/go-live/g, '<span class="nb">go-live</span>')}</h1></header>`;
SK.confirmBox = key => { const l = D.confirm[key]; if (!l) return ""; return `<details class="confirm"><summary>${ic("handshake")}What we’ll confirm together</summary><ul>${l.map(t => `<li>${esc(t)}</li>`).join("")}</ul></details>`; };
SK.tabs = (id, list) => `<div class="tabs" role="tablist" aria-label="Sections">${list.map((t, i) => `<button class="tab" role="tab" id="${id}-t${i}" aria-controls="${id}-p${i}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}" data-i="${i}">${esc(t)}</button>`).join("")}</div>`;
SK.panel = (id, i, html) => `<div class="panel" role="tabpanel" id="${id}-p${i}" aria-labelledby="${id}-t${i}" ${i ? "hidden" : ""}>${html}</div>`;
SK.wireTabs = (root, onShow) => {
  const tabs = $$('.tabs [role="tab"]', root), panels = $$('[role="tabpanel"]', root);
  const pick = (i, focus) => { tabs.forEach((t, k) => { t.setAttribute("aria-selected", k === i); t.tabIndex = k === i ? 0 : -1; }); panels.forEach((p, k) => { p.hidden = k !== i; }); if (focus) tabs[i].focus(); if (onShow) onShow(i); };
  tabs.forEach((t, i) => { t.addEventListener("click", () => pick(i)); t.addEventListener("keydown", e => { let n = null; if (e.key === "ArrowRight") n = (i + 1) % tabs.length; else if (e.key === "ArrowLeft") n = (i + tabs.length - 1) % tabs.length; else if (e.key === "Home") n = 0; else if (e.key === "End") n = tabs.length - 1; if (n !== null) { e.preventDefault(); pick(n, true); } }); });
  return pick;
};
/* runs fn each frame while visible and not paused by the tab being hidden */
SK.loop = fn => { let id = 0, last = 0, on = false; const tick = ts => { if (!on) return; const dt = Math.min(0.1, (ts - last) / 1000); last = ts; if (!document.hidden) fn(dt); id = requestAnimationFrame(tick); }; return { start() { if (on) return; on = true; last = performance.now(); id = requestAnimationFrame(tick); }, stop() { on = false; cancelAnimationFrame(id); }, get on() { return on; } }; };

/* ---------- views registry ---------- */
const VIEWS = [{ id: "home", num: "", title: "Objective of the project", sub: "" }].concat(D.agenda.map(a => ({ id: a.id, num: a.num, title: a.title, sub: a.sub, head: a.head })));
SK.overlays = []; SK.arrow = null; SK.cycleHero = null; SK.stepInfo = null; SK.presenting = false;
SK.closeOverlays = () => { let any = false; SK.overlays.slice().forEach(fn => { try { if (fn()) any = true; } catch (e) {} }); return any; };
SK.reg = (id, render, mount) => { const v = VIEWS.find(x => x.id === id); v.render = render; v.mount = mount; };
const SCOPE_IDS = D.areas.map(a => a.id).concat(D.crosscut.map(x => x.id)); SK.SCOPE_IDS = SCOPE_IDS;
const parseRoute = () => { const raw = (location.hash || "#home").slice(1), m = /^(scope|teams)-([a-z]+)$/.exec(raw); if (m && ((m[1] === "scope" && SCOPE_IDS.includes(m[2])) || (m[1] === "teams" && (m[2] === "sol" || m[2] === "kaar")))) return { id: m[1], param: m[2] }; return { id: raw, param: null }; };

/* ---------- HOME ---------- */
function hubSVG() {
  const cx = 320, cy = 320, R = 184, NR = 41, CR = 98, n = D.areas.length, rr = 266;
  const ico = { ptp: "po", otc: "del", ps: "wbs", fi: "gl", eam: "equip" };
  const lab = { ptp: ["Procure to Pay"], otc: ["Order to Cash"], ps: ["Project System"], fi: ["Finance"], eam: ["Asset", "management"] };
  const a1 = pol(cx, cy, rr, 196), a2 = pol(cx, cy, rr, 284), b1 = pol(cx, cy, rr + 12, 160), b2 = pol(cx, cy, rr + 12, 20);
  let s = `<svg class="hub intro" viewBox="-40 0 720 640" role="group" aria-label="SAP S/4HANA Cloud Public Edition at the centre, with the five process areas around it">`;
  s += `<defs><path id="arcA" d="M${f1(a1[0])} ${f1(a1[1])} A${rr} ${rr} 0 0 1 ${f1(a2[0])} ${f1(a2[1])}"/><path id="arcB" d="M${f1(b1[0])} ${f1(b1[1])} A${rr + 12} ${rr + 12} 0 0 0 ${f1(b2[0])} ${f1(b2[1])}"/></defs>`;
  s += `<circle class="ring o" cx="${cx}" cy="${cy}" r="${rr}"/><circle class="ring" cx="${cx}" cy="${cy}" r="${R}"/>`;
  s += `<text class="arc"><textPath href="#arcA" startOffset="50%" text-anchor="middle">${esc(D.crosscut[0].t)}</textPath></text>`;
  s += `<text class="arc"><textPath href="#arcB" startOffset="50%" text-anchor="middle">${esc(D.crosscut[1].t)}</textPath></text>`;
  D.areas.forEach((a, k) => { const deg = -90 + k * 360 / n, p1 = pol(cx, cy, R - NR - 2, deg), p2 = pol(cx, cy, CR + 4, deg); s += `<path class="spoke" d="M${f1(p1[0])} ${f1(p1[1])} L${f1(p2[0])} ${f1(p2[1])}"/>`; });
  s += `<circle class="core" cx="${cx}" cy="${cy}" r="${CR}"/><text class="core-t" x="${cx}" y="${cy - 22}" font-size="24">SAP S/4HANA</text><text class="core-t s2" x="${cx}" y="${cy + 4}" font-size="17">Cloud Public Edition</text><text class="core-t s2" x="${cx}" y="${cy + 34}" font-size="14" opacity=".9">New Solaris</text><text class="core-t s2" x="${cx}" y="${cy + 51}" font-size="14" opacity=".9">company code</text>`;
  D.areas.forEach((a, k) => {
    const deg = -90 + k * 360 / n, p = pol(cx, cy, R, deg), lines = lab[a.id];
    let lx, ly, an;
    if (Math.abs(p[0] - cx) < 20) { lx = 0; ly = -NR - 16; an = "middle"; }
    else if (p[1] > cy) { lx = 0; ly = NR + 25; an = "middle"; }
    else { lx = p[0] > cx ? NR + 14 : -NR - 14; ly = lines.length > 1 ? -4 : 6; an = p[0] > cx ? "start" : "end"; }
    const t = lines.map((ln, j) => `<tspan x="${lx}" dy="${j ? 20 : 0}">${esc(ln)}</tspan>`).join("");
    s += `<g transform="translate(${f1(p[0])} ${f1(p[1])})"><g class="node" style="--i:${k}" data-area="${a.id}" tabindex="0" role="button" aria-label="${esc(a.name)}: open its GSIs"><circle class="disc" r="${NR}"/>${icu(ico[a.id], -17, -17, 34)}<text x="${lx}" y="${ly}" text-anchor="${an}">${t}</text></g></g>`;
  });
  return s + `</svg>`;
}
function heroCard(m) {
  const blocks = m.blocks.map(b => {
    if (b.t === "tiles") return `<div class="tiles">${b.items.map((t, i) => `<div class="tile"><span class="n">${t[2] ? ic(t[2]) : String(i + 1).padStart(2, "0")}</span><div><b>${esc(t[0])}</b><p>${esc(t[1])}</p></div></div>`).join("")}</div>`;
    if (b.t === "stats") return `${b.h ? `<p class="mini-h">${esc(b.h)}</p>` : ""}<div class="stats c${b.cols || 3}">${b.items.map(s => `<div class="stat"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div>`;
    if (b.t === "note") return `<p class="card-note">${esc(b.text)}</p>`;
    if (b.t === "lead") return `<p class="card-lead">${esc(b.text)}</p>`;
    if (b.t === "label") return `<p class="mini-h">${esc(b.text)}</p>`;
    return "";
  }).join("");
  return `<p class="eyebrow">${esc(m.eyebrow)}</p>${m.title ? `<h2>${esc(m.title)}</h2>` : ""}${blocks}`;
}
function homeView() {

  return `${S.vhead(v)}<div class="nextup" id="nextup" style="margin-top:24px" aria-live="polite">${ic("flag")}<span></span></div><section class="sec" style="margin-top:30px"><h2>Key dates</h2><ol class="dates" id="dates">${dates}</ol></section><div class="twocol sec" style="margin-top:44px"><section style="--c:var(--accent);--o:#fff"><h2>Next steps</h2><p class="sub">Tick them off as they are confirmed.</p><ul class="todo">${steps}</ul></section><section><h2>Key asks</h2><p class="sub">These are the dependencies that most affect the Explore timeline.</p><div class="asks" id="asks">${asks}</div><p class="asum" id="asum" aria-live="polite"></p></section></div><figure class="banner-photo" style="background-image:url(data:image/jpeg;base64,${(window.PORTAL_LOGOS || {}).hero || ""})"><figcaption><b>Omega × KaarTech</b><span>From kickoff on November 18 to go-live on June 1, 2027</span></figcaption></figure>`;
}
function nextMount(root) {
  const view = $(".view", root), N = D.next;
  const n = new Date(), today = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
  const up = N.dates.find(d => S.dUTC(d.iso) >= today), box = $("#nextup span", view);
  if (up) { const k = Math.round((S.dUTC(up.iso) - today) / S.DAY), when = k === 0 ? "today" : k === 1 ? "tomorrow" : `in ${k} days`; box.innerHTML = `<b>${esc(up.t)}</b> is ${when}, on ${S.fmt(S.dUTC(up.iso), true)}.`; const li = $(`#dates li[data-iso="${up.iso}"]`, view); if (li) li.classList.add("nx"); }
  else box.textContent = "All key dates have passed.";
  const asks = $$(".ask", view), sum = $("#asum", view);
  const upd = () => { const c = asks.filter(a => a.classList.contains("ok")).length; sum.textContent = c + " of " + asks.length + " key asks agreed"; };
  asks.forEach(a => { const b = $("button", a); b.addEventListener("click", () => { const on = !a.classList.contains("ok"); a.classList.toggle("ok", on); b.setAttribute("aria-pressed", on); $("span", b).textContent = on ? "Agreed" : "Agree in the room"; upd(); }); });
  upd();
}
S.reg("next", nextView, nextMount);

S.boot();
})();

</script>
